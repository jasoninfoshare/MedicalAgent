<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医疗健康 AI Agent</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%; max-width: 720px; height: 90vh;
            background: #fff; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .header {
            padding: 18px 24px; background: #4a90e2; color: #fff;
            font-size: 18px; font-weight: 600;
        }
        .chat-box {
            flex: 1; overflow-y: auto; padding: 20px 24px;
            display: flex; flex-direction: column; gap: 16px;
        }
        .message {
            max-width: 85%; padding: 12px 16px; border-radius: 10px;
            line-height: 1.6; font-size: 15px; white-space: pre-wrap;
        }
        .user {
            align-self: flex-end; background: #4a90e2; color: #fff;
            border-bottom-right-radius: 2px;
        }
        .bot {
            align-self: flex-start; background: #f1f3f6; color: #333;
            border-bottom-left-radius: 2px;
        }
        .input-area {
            padding: 16px 24px; border-top: 1px solid #e8eaed;
            display: flex; gap: 12px; background: #fafbfc;
        }
        input {
            flex: 1; padding: 12px 16px; border: 1px solid #d1d5db;
            border-radius: 8px; font-size: 15px; outline: none;
        }
        input:focus { border-color: #4a90e2; }
        button {
            padding: 0 22px; background: #4a90e2; color: #fff;
            border: none; border-radius: 8px; font-size: 15px;
            cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: #357abd; }
        button:disabled { background: #a0c4e8; cursor: not-allowed; }
        .loading {
            align-self: flex-start; background: #f1f3f6; color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">🏥 医疗健康 AI Agent</div>
        <div class="chat-box" id="chatBox">
            <div class="message bot">你好！我是医疗健康 AI Agent，请输入您的问题。</div>
        </div>
        <div class="input-area">
            <input type="text" id="questionInput" placeholder="请输入您的问题，例如：糖尿病患者的饮食建议" />
            <button id="sendBtn" onclick="send()">发送</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const input = document.getElementById('questionInput');
        const btn = document.getElementById('sendBtn');

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') send();
        });

        async function send() {
            const q = input.value.trim();
            if (!q) return;
            appendMessage(q, 'user');
            input.value = '';
            btn.disabled = true;

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message loading';
            loadingDiv.textContent = '思考中...';
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: q })
                });
                const data = await res.json();
                loadingDiv.remove();
                appendMessage(data.response || '（无返回内容）', 'bot');
            } catch (err) {
                loadingDiv.remove();
                appendMessage('请求出错：' + err.message, 'bot');
            } finally {
                btn.disabled = false;
                input.focus();
            }
        }

        function appendMessage(text, role) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
